# ============ Aplicacion ============
spring.application.name=gestion-pedidos
server.port=8080

# ============ Base de datos H2 (en memoria) ============
spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============ JPA / Hibernate ============
# create-drop: crea las tablas al arrancar y las borra al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============ Logs ============
logging.level.com.utn.gestionpedidos=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============ Properties propias (las lee AppProperties) ============
app.nombre=Sistema de Gestion de Pedidos
app.version=1.0.0
app.cargar-datos-iniciales=true
app.moneda=ARS
